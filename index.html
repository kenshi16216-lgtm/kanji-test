<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字ポイント通帳</title>
    <script>
        // ★ここにGASの最新URLを貼り付けてください★
        const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzO7Nlg9qP9G7SaeyR5ekNAEroJsNsjcF2PQQPzRBzMXGX9GXTJGiaouOJ4n6z5D4Eg/exec"; 
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .screen { display: none; } .active { display: block; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-save { background: var(--accent); }
        .btn-teacher { background: #e74c3c; padding: 5px 15px; font-size: 0.8rem; width: auto; }
        .status-box { text-align: center; }
        .point-display { font-size: 2.5rem; color: var(--accent); font-weight: bold; margin: 10px 0; }
        .next-ticket { color: #7f8c8d; font-size: 1.1rem; }
        #ticket-win { display: none; background: #f1c40f; padding: 15px; border-radius: 10px; border: 3px dashed #fff; margin-top: 15px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #eee; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold;">漢字ポイント通帳</div>
    <div>
        <button onclick="showScreen('input')" style="background:none; border:1px solid white; color:white; border-radius:15px; padding:5px 10px;">入力</button>
        <button onclick="showScreen('stats')" style="background:none; border:1px solid white; color:white; border-radius:15px; padding:5px 10px;">グラフ</button>
        <button onclick="authTeacher()" class="btn-teacher">先生</button>
    </div>
</header>

<div class="container">
    <div id="screen-input" class="screen active">
        <div class="card status-box">
            <div id="current-name-display">名前を選んでね</div>
            <div class="point-display"><span id="total-pt">0</span> pt</div>
            <div class="next-ticket" id="next-info">あと 100 pt でチケット！</div>
            <div id="ticket-win">🎫 フリーパス券獲得！ 🎫</div>
        </div>

        <div class="card">
            <label>1. 名前</label>
            <select id="student-name" onchange="updateView()"></select>
            
            <label>2. テストの日付</label>
            <input type="date" id="test-date">
            
            <label>3. 点数 (20点満点)</label>
            <input type="number" id="test-score" min="0" max="20" placeholder="点数を入力">
            
            <button class="btn btn-save" onclick="saveData()">ポイントを貯める！</button>
        </div>
    </div>

    <div id="screen-stats" class="screen">
        <div class="card">
            <h3>これまでの成績</h3>
            <canvas id="scoreChart"></canvas>
        </div>
    </div>

    <div id="screen-teacher" class="screen">
        <div class="card">
            <h3>児童の累積ポイント</h3>
            <table>
                <thead><tr><th>名前</th><th>累積</th><th>状況</th></tr></thead>
                <tbody id="teacher-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let names = []; let pointsMap = {}; let allPoints = [];
    let myHistory = JSON.parse(localStorage.getItem('kanji_simple_history') || '[]');
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('test-date').value = today;

    async function init() {
        try {
            const res = await fetch(ENDPOINT_URL);
            const data = await res.json();
            names = data.names; pointsMap = data.pointsMap; allPoints = data.allPoints;
            const select = document.getElementById('student-name');
            select.innerHTML = '<option value="">-- 名前を選択 --</option>';
            names.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n; opt.textContent = n; select.appendChild(opt);
            });
        } catch (e) { alert("データの読み込みに失敗しました"); }
    }

    function updateView() {
        const name = document.getElementById('student-name').value;
        if(!name) return;
        const pt = pointsMap[name] || 0;
        document.getElementById('current-name-display').innerText = name + " の累積ポイント";
        document.getElementById('total-pt').innerText = pt;
        
        const next = 100 - pt;
        document.getElementById('next-info').innerText = next > 0 ? `あと ${next} pt でチケット！` : "100ポイント達成！";
        document.getElementById('ticket-win').style.display = pt >= 100 ? 'block' : 'none';
    }

    async function saveData() {
        const name = document.getElementById('student-name').value;
        const score = document.getElementById('test-score').value;
        const date = document.getElementById('test-date').value;

        if(!name || score === "" || !date) return alert("全部入力してね！");
        if(score < 0 || score > 20) return alert("点数は0〜20の間で入力してね");

        const payload = { name, score: Number(score), date };
        
        try {
            const res = await fetch(ENDPOINT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            
            // ローカル保存
            myHistory.push(payload);
            localStorage.setItem('kanji_simple_history', JSON.stringify(myHistory));

            if(result.newTotal >= 100 && pointsMap[name] < 100) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                alert("おめでとう！100ポイント達成！");
            } else {
                alert(score + "ポイント貯まりました！");
            }
            location.reload();
        } catch (e) { alert("保存に失敗しました"); }
    }

    function authTeacher() {
        if(prompt("パスワード") === "snsei") {
            showScreen('teacher');
            const tbody = document.getElementById('teacher-list');
            tbody.innerHTML = allPoints.map(p => `<tr><td>${p.name}</td><td>${p.point}</td><td>${p.point>=100?'🎫獲得':(100-p.point)+'点'}</td></tr>`).join('');
        } else { alert("パスワードが違います"); }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        if(id === 'stats') renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: myHistory.map(h => h.date),
                datasets: [{ label: '点数', data: myHistory.map(h => h.score), borderColor: '#27ae60', tension: 0.3 }]
            },
            options: { scales: { y: { min: 0, max: 20 } } }
        });
    }

    window.onload = init;
</script>
</body>
</html>
